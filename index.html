<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beetle Bustle Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #051014;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(8, 26, 33, 0.85) 0%, rgba(5, 16, 20, 0) 100%);
            z-index: 10;
        }
        .title-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .orb-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #44C4A4 60%, #0D5C4A 100%);
            box-shadow: 0 0 12px #44C4A4;
        }
        .title-text {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #44C4A4;
            text-shadow: 0 0 10px rgba(68, 196, 164, 0.5);
        }
        .stats-bar {
            display: flex;
            gap: 16px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7A9E9F;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        #gameCanvas {
            width: 100%;
            flex-grow: 1;
            display: block;
            touch-action: none;
        }
        footer {
            width: 100%;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #4B6E70;
            background: linear-gradient(0deg, rgba(8, 26, 33, 0.9) 0%, rgba(5, 16, 20, 0) 100%);
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-badge">
            <div class="orb-icon"></div>
            <div class="title-text">BEETLE BUSTLE</div>
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Score</span>
                <span id="scoreVal" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Best</span>
                <span id="bestVal" class="stat-value">0</span>
            </div>
        </div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <footer>
        Drag paddle to catch falling glowing orbs
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const bestVal = document.getElementById('bestVal');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = canvas.clientHeight || (window.innerHeight - 100);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = canvas.clientHeight || (window.innerHeight - 100);
        });

        let score = 0;
        let best = localStorage.getItem('bb_best') || 0;
        bestVal.innerText = best;

        const paddle = {
            width: 90,
            height: 18,
            x: width / 2 - 45,
            y: height - 40,
            targetX: width / 2 - 45
        };

        const orbs = [];
        const particles = [];
        const colors = [
            { main: '#44C4A4', light: '#E0FFF7', shadow: 'rgba(68,196,164,0.6)', pts: 10 },
            { main: '#FFD15C', light: '#FFF6D6', shadow: 'rgba(255,209,92,0.6)', pts: 25 },
            { main: '#4FA3E3', light: '#E3F2FD', shadow: 'rgba(79,163,227,0.6)', pts: 15 },
            { main: '#E4648C', light: '#FFE4EC', shadow: 'rgba(228,100,140,0.6)', pts: 50 }
        ];

        function spawnOrb() {
            const col = colors[Math.floor(Math.random() * colors.length)];
            orbs.push({
                x: 30 + Math.random() * (width - 60),
                y: -20,
                radius: 12 + Math.random() * 4,
                speed: 2.2 + Math.random() * 2.5,
                color: col
            });
        }

        let spawnTimer = 0;

        function addParticles(x, y, color) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 1.5 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    radius: 2 + Math.random() * 2.5,
                    alpha: 1,
                    color: color
                });
            }
        }

        function handleMove(clientX) {
            paddle.targetX = clientX - paddle.width / 2;
            if (paddle.targetX < 10) paddle.targetX = 10;
            if (paddle.targetX > width - paddle.width - 10) paddle.targetX = width - paddle.width - 10;
        }

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        }, { passive: true });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        }, { passive: true });

        canvas.addEventListener('mousemove', (e) => {
            handleMove(e.clientX);
        });

        function update() {
            paddle.x += (paddle.targetX - paddle.x) * 0.25;
            paddle.y = height - 40;

            spawnTimer++;
            if (spawnTimer > 40) {
                spawnOrb();
                spawnTimer = 0;
            }

            for (let i = orbs.length - 1; i >= 0; i--) {
                const o = orbs[i];
                o.y += o.speed;

                if (o.y + o.radius >= paddle.y && 
                    o.y - o.radius <= paddle.y + paddle.height &&
                    o.x >= paddle.x - 8 && 
                    o.x <= paddle.x + paddle.width + 8) {
                    
                    score += o.color.pts;
                    scoreVal.innerText = score;
                    if (score > best) {
                        best = score;
                        bestVal.innerText = best;
                        localStorage.setItem('bb_best', best);
                    }
                    addParticles(o.x, o.y, o.color.main);
                    orbs.splice(i, 1);
                    continue;
                }

                if (o.y > height + 25) {
                    orbs.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#06161C';
            ctx.strokeStyle = '#0F303B';
            ctx.lineWidth = 1;
            const gridSpacing = 40;
            for (let x = 0; x < width; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // Draw paddle (saucer)
            ctx.save();
            ctx.shadowColor = '#44C4A4';
            ctx.shadowBlur = 12;
            const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            grad.addColorStop(0, '#5DE0BF');
            grad.addColorStop(0.5, '#2D9378');
            grad.addColorStop(1, '#0F4436');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 9);
            ctx.fill();

            ctx.strokeStyle = '#A8FFE6';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Specular highlight
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.ellipse(paddle.x + paddle.width / 2, paddle.y + 4, paddle.width * 0.35, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw orbs
            for (const o of orbs) {
                ctx.save();
                ctx.shadowColor = o.color.shadow;
                ctx.shadowBlur = 16;
                const orbGrad = ctx.createRadialGradient(
                    o.x - o.radius * 0.3, o.y - o.radius * 0.3, o.radius * 0.1,
                    o.x, o.y, o.radius
                );
                orbGrad.addColorStop(0, '#ffffff');
                orbGrad.addColorStop(0.4, o.color.light);
                orbGrad.addColorStop(0.8, o.color.main);
                orbGrad.addColorStop(1, '#051014');
                ctx.fillStyle = orbGrad;
                ctx.beginPath();
                ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw particles
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
